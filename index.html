<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENS/B/26 Official App</title>
<script src="https://meet.jit.si/external_api.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial;background:#eef6ee;margin:0;padding:0 0 80px 0;user-select:none;-webkit-user-select:none}
.header{background:#1b5e20;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.ppic{width:44px;height:44px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:2px solid #1b5e20;z-index:100;overflow:auto}
.bTab{flex:1;padding:10px 2px;text-align:center;font-size:10px;cursor:pointer;min-width:52px;font-weight:bold}
.bTab.active{background:#1b5e20;color:#fff}
.card{background:#fff;margin:8px;border-radius:12px;padding:12px;box-shadow:0 2px 6px #0001}
.btn{background:#1b5e20;color:#fff;border:0;padding:13px;border-radius:10px;width:100%;font-weight:bold;margin:6px 0;cursor:pointer;font-size:15px}
.btn2{background:#fff;color:#1b5e20;border:1.5px solid #1b5e20;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.btnWa{background:#25D366;color:#fff;border:0;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
.btnCall{background:#1565c0;color:#fff;border:0;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1.5px solid #aaa;border-radius:10px;font-size:16px;background:#fff}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:9999;display:none;padding:15px;overflow:auto}
.modalBox{background:#fff;border-radius:16px;padding:18px;max-width:420px;margin:30px auto}
.homeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.homeCard{background:#fff;border-radius:16px;padding:0;text-align:center;box-shadow:0 3px 8px #0002;border-left:6px solid #1b5e20;overflow:hidden}
.openBtn{border:0;padding:14px 10px;width:100%;background:transparent;cursor:pointer}
.openBtnInner{background:#1b5e20;color:#fff;padding:7px 18px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px;display:inline-block}
#jitsi{width:100%;height:420px;display:none;border-radius:12px;margin-top:8px}
.chatBox{height:220px;overflow:auto;background:#f0f4c3;padding:8px;border-radius:10px}
</style>
</head>
<body>

<div class=header>
<div style=display:flex;gap:10px;align-items:center>
<img id=myPic class=ppic src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
<div><b id=myName>ENS/B/26</b><br><small id=myReg>Moi University - 11 Members</small></div>
</div>
<button class=btn2 style=background:#fff onclick=openModal('profileModal')>👤 Profile</button>
</div>

<div id=home>
<div class=card style=background:linear-gradient(135deg,#1b5e20,#66bb6a);color:#fff;text-align:center>
<h2 style=margin:5px>🌍 ENS/B/26 OFFICIAL</h2>
<p>Moi University - Environmental Science</p>
<small>Patron: Dr. Okore Luther | Rep: Amos Nyongesa</small>
<p id=liveBanner style=background:#fff;color:#d32f2f;padding:10px;border-radius:20px;display:none;font-weight:bold;margin-top:10px>🔴 LIVE NOW - Tap to Join</p>
</div>

<div class=homeGrid>
<div class=homeCard style=border-color:#1b5e20><button class=openBtn onclick=showPage('qa')><div style=font-size:32px>💬</div><b>Q&A</b><br><small>Ask & Answer</small><br><span class=openBtnInner>OPEN</span></button></div>
<div class=homeCard style=border-color:#1565c0><button class=openBtn onclick=showPage('notes')><div style=font-size:32px>📚</div><b>Notes</b><br><small>Class Notes</small><br><span class=openBtnInner style=background:#1565c0>OPEN</span></button></div>
<div class=homeCard style=border-color:#ff9800><button class=openBtn onclick=showPage('timetable')><div style=font-size:32px>🕒</div><b>Timetable</b><br><small>Schedule</small><br><span class=openBtnInner style=background:#ff9800>OPEN</span></button></div>
<div class=homeCard style=border-color:#9c27b0><button class=openBtn onclick=showPage('ai')><div style=font-size:32px>🤖</div><b>AI Tutor</b><br><small>Ask Anything</small><br><span class=openBtnInner style=background:#9c27b0>OPEN</span></button></div>
<div class=homeCard style=border-color:#25D366><button class=openBtn onclick=showPage('chat')><div style=font-size:32px>💬</div><b>Chat</b
