<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcolernBook - Academic Facebook for ENS/B/26</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey:"YOUR_API_KEY", authDomain:"ecolern-2691b.firebaseapp.com", projectId:"ecolern-2691b", storageBucket:"ecolern-2691b.appspot.com", messagingSenderId:"123", appId:"1:123:web:abc" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
window.db=db; window.collection=collection; window.addDoc=addDoc; window.query=query; window.orderBy=orderBy; window.limit=limit; window.onSnapshot=onSnapshot; window.serverTimestamp=serverTimestamp; window.doc=doc; window.setDoc=setDoc; window.updateDoc=updateDoc; window.deleteDoc=deleteDoc; window.arrayUnion=arrayUnion; window.arrayRemove=arrayRemove; window.increment=increment;
</script>
<style>body{background:#f0f2f5}.fb-card{background:white;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.1)}.fb-btn:hover{background:#f2f2f2}</style>
</head><body>

<!-- FACEBOOK HEADER -->
<header class="bg-white shadow sticky top-0 z-50 flex justify-between items-center px-3 py-2">
<div class="flex items-center gap-2"><div class="w-10 h-10 bg-green-600 text-white rounded-full flex items-center justify-center font-bold text-xl">e</div><h1 class="font-bold text-green-700 hidden md:block">ecolernbook</h1><div class="bg-gray-100 rounded-full px-3 py-1.5 flex items-center gap-2"><i class="fa fa-search text-gray-500 text-sm"></i><input id="fbSearch" oninput="searchFeed()" class="bg-transparent outline-none text-sm w-32 md:w-64" placeholder="Search ENS..."></div></div>
<div class="flex gap-1 md:gap-6 text-xl text-gray-600"><i class="fa fa-home text-green-600"></i><i class="fa fa-users hidden md:block"></i><i class="fa fa-video hidden md:block"></i><i class="fa fa-book"></i></div>
<div class="flex items-center gap-2"><button class="w-8 h-8 bg-gray-200 rounded-full"><i class="fa fa-plus text-sm"></i></button><button class="w-8 h-8 bg-gray-200 rounded-full"><i class="fa fa-bell text-sm"></i></button><div id="fbProfile" class="w-8 h-8 bg-green-600 rounded-full flex items-center justify-center text-white font-bold text-sm">G</div></div>
</header>

<div class="max-w-[1300px] mx-auto grid grid-cols-1 md:grid-cols-12 gap-0 md:gap-4 pt-2">

<!-- LEFT SIDEBAR - Facebook style -->
<div class="hidden md:block col-span-3 p-2 space-y-1 sticky top-[60px] h-[90vh] overflow-y-auto">
<div class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded cursor-pointer"><div id="leftAvatar" class="w-8 h-8 bg-green-600 rounded-full flex items-center justify-center text-white font-bold">A</div><b id="leftName" class="text-sm">Amos Nyongesa</b></div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer" onclick="filterFeed('all')"><i class="fa fa-newspaper w-6 text-blue-500"></i> News Feed</div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer"><i class="fa fa-user-friends w-6 text-blue-400"></i> Classmates (<span id="memberCount">0</span>)</div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer" onclick="filterFeed('notes')"><i class="fa fa-book w-6 text-green-600"></i> Dr Okore Notes</div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer" onclick="filterFeed('assignment')"><i class="fa fa-tasks w-6 text-red-500"></i> Assignments</div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer" onclick="filterFeed('pastpaper')"><i class="fa fa-file-alt w-6 text-yellow-600"></i> Past Papers</div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer"><i class="fa fa-calendar w-6 text-purple-600"></i> Timetable - <span class="text-xs">by Amos</span></div>
<div class="p-2 hover:bg-gray-200 rounded text-sm cursor-pointer"><i class="fa fa-video w-6 text-red-600"></i> Live Lessons</div>
<hr class="my-2">
<p class="text-xs text-gray-500 font-bold">Your Courses</p>
<div class="p-2 hover:bg-gray-200 rounded text-xs cursor-pointer">ENS 101 - Ecology Basics</div>
<div class="p-2 hover:bg-gray-200 rounded text-xs cursor-pointer">ENS 102 - Soil Science</div>
<div class="p-2 hover:bg-gray-200 rounded text-xs cursor-pointer">ENS 201 - GIS & Remote Sensing</div>
<button id="loginBtn" class="w-full mt-3 bg-green-600 text-white py-2 rounded text-sm font-bold">Register / Login</button>
</div>

<!-- CENTER FEED - Like Facebook -->
<div class="col-span-12 md:col-span-6">

<!-- Create Post - Facebook style -->
<div class="fb-card p-3 m-2">
<div class="flex gap-2 items-center"><div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center text-white font-bold" id="postAvatar">A</div><button onclick="focusPost()" class="flex-1 bg-gray-100 rounded-full text-left px-4 py-2 text-sm text-gray-500">What's on your mind, <span id="postName">ENS Student</span>?</button></div>
<hr class="my-3">
<div class="flex justify-around text-sm text-gray-600">
<button onclick="setPostType('question')" class="flex items-center gap-2 p-2 fb-btn rounded"><i class="fa fa-question-circle text-green-500"></i> Question</button>
<button onclick="setPostType('notes')" class="flex items-center gap-2 p-2 fb-btn rounded"><i class="fa fa-book text-blue-500"></i> Note</button>
<button onclick="setPostType('live')" class="flex items-center gap-2 p-2 fb-btn rounded"><i class="fa fa-video text-red-500"></i> Live Lesson</button>
</div>
<!-- Expanded Post Area -->
<div id="createPostArea" class="hidden mt-3">
<div class="flex gap-2 mb-2"><select id="postType" class="border rounded-full px-3 py-1 text-xs"><option value="general">General Post</option><option value="question">Question - Help Needed</option><option value="notes">Notes - Dr Okore Only</option><option value="assignment">Assignment</option><option value="pastpaper">Past Paper</option><option value="live">Live Lesson Link</option></select><span id="postRoleBadge" class="text-[10px] bg-yellow-100 px-2 py-1 rounded-full">Member</span></div>
<textarea id="postText" class="w-full border rounded-lg p-3 text-sm" rows="3" placeholder="Explain your question, share notes, assignment..."></textarea>
<input id="postLink" class="w-full border rounded-lg p-2 mt-2 text-sm" placeholder="Optional: Link (YouTube, Drive, IMO, Meet...)">
<div class="flex justify-between mt-2"><button onclick="document.getElementById('createPostArea').classList.add('hidden')" class="text-sm text-gray-500">Cancel</button><button onclick="createPost()" class="bg-blue-600 text-white px-6 py-1.5 rounded-full text-sm font-bold">Post</button></div>
</div>
</div>

<!-- FEED -->
<div id="feed" class="space-y-2 p-2">Loading academic feed...</div>

</div>

<!-- RIGHT SIDEBAR - Contacts
