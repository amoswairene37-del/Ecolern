function show(t){['qa','ai','notes','past','live','class'].forEach(x=>{document.getElementById(x).style.display=x==t?'block':'none';document.getElementById('t'+(['qa','ai','notes','past','live','class'].indexOf(x)+1)).className=x==t?'tab active':'tab'});if(t=='notes')renderNotes('note');if(t=='past')renderNotes('past');if(t=='live')renderLive();if(t=='class'){renderStudents();renderGroupChat()}}
function loadProfile(){if(myProfile.name){document.getElementById('myNameTxt').innerText=myProfile.name;document.getElementById('pName').value=myProfile.name;document.getElementById('myRegTxt').innerText=myProfile.reg||'Moi University'}if(myProfile.reg)document.getElementById('pReg').value=myProfile.reg;if(myProfile.phone)document.getElementById('pPhone').value=myProfile.phone;if(myProfile.pic)document.getElementById('myPic').src=myProfile.pic}

function saveProfile(){
let name=document.getElementById('pName').value||'Student';let reg=document.getElementById('pReg').value||'';let phone=document.getElementById('pPhone').value||'';let pic=document.getElementById('preview').dataset.url||myProfile.pic||'https://cdn-icons-png.flaticon.com/512/149/149071.png';
myProfile={name,reg,phone,pic};localStorage.setItem('myProf',JSON.stringify(myProfile));
// Add to students directory
let idx=students.findIndex(s=>s.reg==reg && reg!='');
if(idx>=0){students[idx]=myProfile}else{students.unshift(myProfile)}
localStorage.setItem('ensStudents',JSON.stringify(students));
loadProfile();renderStudents();
alert('Registered! You appear in Class tab now.');document.getElementById('profileBox').style.display='none'
}
