<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecolern ENS/B/26 Hub + Messenger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
// ⚠️ REPLACE THIS CONFIG WITH YOUR REAL ONE FROM Firebase Console > Project Settings > General
const firebaseConfig = {
  apiKey:"AIzaSy...",
  authDomain:"ecolern-2691b.firebaseapp.com",
  projectId:"ecolern-2691b",
  storageBucket:"ecolern-2691b.appspot.com",
  messagingSenderId:"123456",
  appId:"1:123:web:abc"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
window.db=db; window.collection=collection; window.addDoc=addDoc; window.query=query; window.orderBy=orderBy; window.limit=limit; window.onSnapshot=onSnapshot; window.serverTimestamp=serverTimestamp; window.doc=doc; window.setDoc=setDoc;
</script>
<style>.tab-active{border-bottom:3px solid #16a34a;color:#16a34a;font-weight:700}</style>
</head><body class="bg-gray-50">
<header class="bg-green-700 text-white p-4 flex justify-between sticky top-0 z-50"><div><h1 class="font-bold">Ecolern ENS/B/26</h1><p class="text-xs">Rep: Amos Nyongesa | Patron: Dr Okore</p></div><div><span id="userRole" class="bg-white text-green-700 px-2 py-1 rounded-full text-xs font-bold">Guest</span><button id="loginBtn" class="ml-2 bg-yellow-400 text-black px-3 py-1 rounded text-sm font-bold">Register</button></div></header>
<nav class="bg-white flex overflow-x-auto border-b sticky top-[60px] z-40">
<button onclick="showTab('messenger')" id="tab-messenger" class="tab-active px-4 py-3 text-sm"><i class="fa fa-comments"></i> Messenger</button>
<button onclick="showTab('qa')" id="tab-qa" class="px-4 py-3 text-sm"><i class="fa fa-question"></i> Q&A</button>
<button onclick="showTab('notes')" id="tab-notes" class="px-4 py-3 text-sm"><i class="fa fa-book"></i> Notes</button>
<button onclick="showTab('assignments')" id="tab-assignments" class="px-4 py-3 text-sm"><i class="fa fa-tasks"></i> Assignments</button>
<button onclick="showTab('papers')" id="tab-papers" class="px-4 py-3 text-sm"><i class="fa fa-file"></i> Past Papers</button>
<button onclick="showTab('lessons')" id="tab-lessons" class="px-4 py-3 text-sm"><i class="fa fa-video"></i> Lessons</button>
<button onclick="showTab('timetable')" id="tab-timetable" class="px-4 py-3 text-sm"><i class="fa fa-calendar"></i> Timetable</button>
<button onclick="showTab('ai')" id="tab-ai" class="px-4 py-3 text-sm"><i class="fa fa-robot"></i> AI</button>
</nav>
<main class="p-3 max-w-5xl mx-auto">

<!-- MESSENGER -->
<div id="section-messenger" class="tab-section"><div class="grid md:grid-cols-3 gap-3 h-[75vh]">
<div class="bg-white rounded shadow p-3 flex flex-col"><h3 class="font-bold text-sm mb-2"><i class="fa fa-users"></i> Members</h3><div class="flex gap-2 mb-2"><button id="btn-group" onclick="setChatMode('group')" class="flex-1 bg-green-600 text-white py-1 rounded text-xs font-bold">Group</button><button id="btn-dm" onclick="setChatMode('dm')" class="flex-1 bg-gray-200 py-1 rounded text-xs">DMs</button></div><div id="membersListChat" class="flex-1 overflow-y-auto space-y-1 text-sm"></div></div>
<div class="bg-white rounded shadow col-span-2 flex flex-col"><div class="p-3 border-b flex justify-between"><b id="chatTitle" class="text-sm">Group Chat - ENS/B/26</b><span class="text-xs text-green-600">● Live</span></div><div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-50"></div><div class="p-2 border-t flex gap-2"><input id="chatInput" class="flex-1 border p-2 rounded text-sm" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()"><button onclick="sendMessage()" class="bg-green-600 text-white px-4 rounded"><i class="fa fa-paper-plane"></i></button></div></div>
</div></div>

<!-- Q&A -->
<div id="section-qa" class="tab-section hidden"><div class="bg-white p-3 rounded shadow mb-3"><textarea id="qText" class="w-full border p-2 rounded text-sm" placeholder="Ask question..."></textarea><button onclick="postQuestion()" class="mt-2 bg-green-600 text-white px-3 py-1 rounded text-sm">Post Question</button></div><div id="qList"></div></div>

<!-- NOTES -->
<div id="section-notes" class="tab-section hidden"><div id="notesAdmin" class="hidden bg-yellow-50 border p-3 rounded mb-3"><input id="noteTitle" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Note title"><textarea id="noteContent" class="w-full border p-2 rounded text-sm" placeholder="Content / link"></textarea><button onclick="postNote()" class="mt-2 bg-green-700 text-white px-3 py-1 rounded text-sm">Post Note (Dr Okore only)</button></div><div id="notesList"></div></div>

<!-- ASSIGNMENTS -->
<div id="section-assignments" class="tab-section hidden"><div id="assignAdmin" class="hidden bg-yellow-50 border p-3 rounded mb-3"><input id="assignTitle" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Assignment title"><textarea id="assignDesc" class="w-full border p-2 rounded text-sm" placeholder="Details + deadline"></textarea><button onclick="postAssignment()" class="mt-2 bg-green-700 text-white px-3 py-1 rounded text-sm">Post Assignment (Dr Okore only)</button></div><div id="assignList"></div></div>

<!-- PAST PAPERS -->
<div id="section-papers" class="tab-section hidden"><div class="bg-white p-3 rounded shadow"><h3 class="font-bold text-sm">Past Papers Repository</h3><input id="paperSearch" oninput="filterPapers()" class="w-full border p-2 rounded text-sm mt-2" placeholder="Search unit..."><div id="papersList" class="mt-3 grid gap-2"></div></div></div>

<!-- LESSONS -->
<div id="section-lessons" class="tab-section hidden"><div class="bg-white p-3 rounded shadow"><h3 class="font-bold text-sm">Online Lessons</h3><div class="aspect-video bg-black rounded flex items-center justify-center text-white text-sm mt-2">Live Lesson Player - Paste YouTube/Meet link in Notes</div><div id="lessonsList" class="mt-3"></div></div></div>

<!-- TIMETABLE -->
<div id="section-timetable" class="tab-section hidden"><div id="timeAdmin" class="hidden bg-blue-50 border p-3 rounded mb-3"><textarea id="timeContent" class="w-full border p-2 rounded text-sm" placeholder="Paste timetable or image link..."></textarea><button onclick="postTimetable()" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-sm">Update Timetable (Amos only)</button></div><div id="timetableView" class="bg-white p-3 rounded shadow text-sm whitespace-pre-wrap">Loading timetable...</div></div>

<!-- AI -->
<div id="section-ai" class="tab-section hidden"><div class="bg-white p-3 rounded shadow h-[70vh] flex flex-col"><div id="aiChat" class="flex-1 overflow-y-auto space-y-2 mb-2 p-2 bg-gray-50 rounded text-sm"></div><div class="flex gap-2"><input id="aiInput" class="flex-1 border p-2 rounded text-sm" placeholder="Ask AI anything about ENS..."><button onclick="askAI()" class="bg-purple-600 text-white px-3 rounded"><i class="fa fa-paper-plane"></i></button></div></div></div>

</main>

<!-- LOGIN MODAL -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[100]"><div class="bg-white p-5 rounded w-[90%] max-w-sm"><h3 class="font-bold mb-3">Register as Member</h3><input id="regName" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Full Name"><input id="regNo" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Reg No ENS/B/26/..."><select id="regRole" class="w-full border p-2 rounded mb-3 text-sm"><option value="member">Student Member</option><option value="rep">ENS Rep (Amos)</option><option value="patron">Patron Dr Okore</option></select><button onclick="registerUser()" class="w-full bg-green-600 text-white py-2 rounded font-bold">Enter Hub</button><button onclick="document.getElementById('loginModal').classList.add('hidden')" class="w-full mt-2 text-xs text-gray-500">Cancel</button></div></div>

<script>
let currentUser=null; let chatMode='group'; let dmTo=null;
function showTab(t){document.querySelectorAll('.tab-section').forEach(s=>s.classList.add('hidden'));document.getElementById('section-'+t).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('tab-active'));document.getElementById('tab-'+t).classList.add('tab-active'); if(t==='messenger') loadMessenger();}
document.getElementById('loginBtn').onclick=()=>document.getElementById('loginModal').classList.remove('hidden');
async function registerUser(){const name=document.getElementById('regName').value; const regNo=document.getElementById('regNo').value; const role=document.getElementById('regRole').value; if(!name) return alert('Enter name'); currentUser={name,regNo,role}; localStorage.setItem('ecolern_user', JSON.stringify(currentUser)); document.getElementById('userRole').textContent=role.toUpperCase(); document.getElementById('loginBtn').textContent=name; document.getElementById('loginModal').classList.add('hidden'); if(role==='patron'){document.getElementById('notesAdmin').classList.remove('hidden');document.getElementById('assignAdmin').classList.remove('hidden');} if(role==='rep'){document.getElementById('timeAdmin').classList.remove('hidden');} try{await setDoc(doc(db,'members', regNo||name), {name,regNo,role, joined:serverTimestamp()});}catch(e){} loadMessenger();}
window.onload=()=>{const saved=localStorage.getItem('ecolern_user'); if(saved){currentUser=JSON.parse(saved);document.getElementById('userRole').textContent=currentUser.role.toUpperCase();document.getElementById('loginBtn').textContent=currentUser.name; if(currentUser.role==='patron'){document.getElementById('notesAdmin').classList.remove('hidden');document.getElementById('assignAdmin').classList.remove('hidden');} if(currentUser.role==='rep'){document.getElementById('timeAdmin').classList.remove('hidden');}} loadAll(); loadMessenger();}
function setChatMode(mode){chatMode=mode; document.getElementById('btn-group').className= mode==='group'?'flex-1 bg-green-600 text-white py-1 rounded text-xs font-bold':'flex-1 bg-gray-200 py-1 rounded text-xs'; document.getElementById('btn-dm').className= mode==='dm'?'flex-1 bg-green-600 text-white py-1 rounded text-xs font-bold':'flex-1 bg-gray-200 py-1 rounded text-xs'; if(mode==='group'){document.getElementById('chatTitle').textContent='Group Chat - ENS/B/26'; dmTo=null;} loadMessenger();}
function loadMessenger(){const q=query(collection(db,'chats'), orderBy('timestamp','desc'), limit(50)); onSnapshot(q, snap=>{const box=document.getElementById('chatMessages'); if(!box) return; box.innerHTML=''; let msgs=[]; snap.forEach(d=>msgs.push({id:d.id,...d.data()})); msgs.reverse(); msgs.forEach(m=>{if(chatMode==='dm' && dmTo && m.to!==dmTo && m.from!==dmTo) return; const isMe=m.name===currentUser?.name; box.innerHTML+=`<div class="${isMe?'text-right':''}"><div class="${isMe?'bg-green-600 text-white':'bg-white'} inline-block px-3 py-1.5 rounded-lg max-w-[80%] shadow text-sm"><div class="text-[9px] opacity-60">${m.name}${m.to?' → '+m.to:''}</div>${m.text}</div></div>`;}); box.scrollTop=box.scrollHeight;}); onSnapshot(collection(db,'members'), snap=>{const list=document.getElementById('membersListChat'); if(!list) return; list.innerHTML=''; snap.forEach(d=>{const mem=d.data(); if(mem.name!==currentUser?.name){list.innerHTML+=`<div onclick="startDM('${mem.regNo||mem.name}','${mem.name}')" class="p-2 hover:bg-gray-100 rounded cursor-pointer flex justify-between text-xs"><span>${mem.name}</span><span class="text-[10px] text-gray-400">${mem.role||''}</span></div>`;}});});}
window.startDM=(regNo,name)=>{chatMode='dm'; dmTo=regNo; document.getElementById('chatTitle').textContent='DM: '+name; setChatMode('dm'); loadMessenger();}
window.sendMessage=async()=>{if(!currentUser) return alert('Register first'); const text=document.getElementById('chatInput').value; if(!text) return; const payload={text,name:currentUser.name,from:currentUser.regNo||currentUser.name,timestamp:serverTimestamp()}; if(chatMode==='dm'&&dmTo) payload.to=dmTo; await addDoc(collection(db,'chats'), payload); document.getElementById('chatInput').value='';};
function loadAll(){onSnapshot(query(collection(db,'questions'), orderBy('created','desc'), limit(20)), snap=>{const list=document.getElementById('qList'); list.innerHTML=''; snap.forEach(d=>{const data=d.data(); list.innerHTML+=`<div class="bg-white p-3 rounded shadow mb-2 text-sm"><b>${data.name}</b><p class="mt-1">${data.text}</p><div class="mt-2 flex gap-1"><input id="ans-${d.id}" class="flex-1 border p-1 rounded text-xs" placeholder="Answer..."><button onclick="answerQ('${d.id}')" class="bg-gray-800 text-white px-2 py-1 rounded text-xs">Answer</button></div><div id="answers-${d.id}" class="mt-1"></div></div>`; onSnapshot(collection(db,'questions',d.id,'answers'), s=>{let h=''; s.forEach(a=>{h+=`<div class="bg-gray-100 p-1.5 rounded mt-1 text-xs"><b>${a.data().name}:</b> ${a.data().text}</div>`}); const el=document.getElementById('answers-'+d.id); if(el) el.innerHTML=h;});});}); onSnapshot(query(collection(db,'notes'), orderBy('created','desc'), limit(20)), snap=>{const list=document.getElementById('notesList'); list.innerHTML=''; snap.forEach(d=>{list.innerHTML+=`<div class="bg-white p-3 rounded shadow mb-2 text-sm"><b>${d.data().title}</b> <span class="text-xs text-gray-500">by Dr Okore</span><p class="mt-1 whitespace-pre-wrap">${d.data().content}</p></div>`;});}); onSnapshot(query(collection(db,'assignments'), orderBy('created','desc'), limit(20)), snap=>{const list=document.getElementById('assignList'); list.innerHTML=''; snap.forEach(d=>{list.innerHTML+=`<div class="bg-white p-3 rounded shadow mb-2 border-l-4 border-red-500 text-sm"><b>${d.data().title}</b><p class="mt-1 whitespace-pre-wrap">${d.data().desc}</p></div>`;});}); onSnapshot(doc(db,'config','timetable'), snap=>{if(snap.exists()) document.getElementById('timetableView').textContent=snap.data().content; else document.getElementById('timetableView').textContent='No timetable yet. Amos will upload.';}); window.allPapers=[{unit:'ENS 101 Ecology',year:'2023'},{unit:'ENS 102 Soil Science',year:'2024'},{unit:'ENS 201 GIS',year:'2023'},{unit:'ENS 203 Environmental Law',year:'2024'}]; renderPapers(window.allPapers);}
function renderPapers(list){const el=document.getElementById('papersList'); if(!el) return; el.innerHTML=list.map(p=>`<div class="flex justify-between bg-white p-2 rounded shadow text-sm"><span>${p.unit} - ${p.year}</span><a class="text-green-600 font-bold">Open</a></div>`).join('');}
window.filterPapers=()=>{const q=document.getElementById('paperSearch').value.toLowerCase(); renderPapers(window.allPapers.filter(p=>p.unit.toLowerCase().includes(q)));};
window.postQuestion=async()=>{if(!currentUser) return alert('Register'); const text=document.getElementById('qText').value; if(!text) return; await addDoc(collection(db,'questions'), {text,name:currentUser.name,regNo:currentUser.regNo,created:serverTimestamp()}); document.getElementById('qText').value='';};
window.answerQ=async(qid)=>{if(!currentUser) return alert('Register'); const input=document.getElementById('ans-'+qid); await addDoc(collection(db,'questions',qid,'answers'), {text:input.value,name:currentUser.name,created:serverTimestamp()}); input.value='';};
window.postNote=async()=>{const title=document.getElementById('noteTitle').value; const content=document.getElementById('noteContent').value; await addDoc(collection(db,'notes'), {title,content,created:serverTimestamp()}); document.getElementById('noteTitle').value='';document.getElementById('noteContent').value='';};
window.postAssignment=async()=>{const title=document.getElementById('assignTitle').value; const desc=document.getElementById('assignDesc').value; await addDoc(collection(db,'assignments'), {title,desc,created:serverTimestamp()}); document.getElementById('assignTitle').value='';document.getElementById('assignDesc').value='';};
window.postTimetable=async()=>{const content=document.getElementById('timeContent').value; await setDoc(doc(db,'config','timetable'), {content,updated:serverTimestamp(),by:'Amos'}); alert('Timetable updated!');};
window.askAI=async()=>{const q=document.getElementById('aiInput').value; if(!q) return; const chat=document.getElementById('aiChat'); chat.innerHTML+=`<div class="text-right"><span class="bg-green-600 text-white px-3 py-1 rounded inline-block text-sm">${q}</span></div>`; document.getElementById('aiInput').value=''; chat.innerHTML+=`<div id="ai-thinking" class="text-gray-500 text-xs">AI thinking...</div>`; setTimeout(()=>{document.getElementById('ai-thinking').remove(); const a=q.toLowerCase().includes('soil')?'Soil: O-A-B-C horizons, pH 6-7 best, texture triangle. See Dr Okore notes.': q.toLowerCase().includes('gis')?'GIS uses layers, QGIS/ArcGIS, buffering & overlay.':'As ENS AI tutor I help with Ecology, Soil, GIS, Law. Ask specific topic!'; chat.innerHTML+=`<div><span class="bg-white border px-3 py-1 rounded inline-block text-sm"><i class="fa fa-robot text-purple-600"></i> ${a}</span></div>`; chat.scrollTop=chat.scrollHeight;},600);};
</script>
</body></html>
